[project]
name = "price-predictor-openai-finetune"
version = "0.1.0"
description = "Fine-tune gpt-4.1-nano on OpenAI to predict product prices from summaries, and compare it with the base model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "datasets>=3.6,<5",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
plots = ["plotly>=5.20", "pandas>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
openai-ft = "price_openai_ft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_openai_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

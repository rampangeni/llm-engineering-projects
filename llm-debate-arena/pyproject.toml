[project]
name = "llm-debate-arena"
version = "0.1.0"
description = "Multi-provider LLM calls, model comparison, prompt-caching demo and configurable multi-bot conversations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109.1",
    "python-dotenv>=1.1.1",
    "gradio>=5.47.2,<6.0",
]

[project.optional-dependencies]
# litellm powers the cost/usage reporting and the prompt-caching demo
litellm = ["litellm>=1.77.5"]
dev = ["pytest>=8.0"]

[project.scripts]
debate-arena = "llm_debate_arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_debate_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "airline-ai-assistant"
version = "0.1.0"
description = "FlightAI: a tool-calling, multimodal (image + speech) airline support chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109.1",
    "python-dotenv>=1.1.1",
    "gradio>=5.47.2,<6.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
airline-assistant = "airline_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airline_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

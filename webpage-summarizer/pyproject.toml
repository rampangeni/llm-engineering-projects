[project]
name = "webpage-summarizer"
version = "0.1.0"
description = "Summarize any web page with an LLM (OpenAI or local Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "gradio>=5.47.2,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
webpage-summarizer = "webpage_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webpage_summarizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

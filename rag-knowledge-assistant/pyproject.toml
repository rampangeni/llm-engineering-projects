[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "Insurellm expert knowledge worker: basic and pro RAG pipelines with evaluation and a Gradio UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "tenacity>=8.2",
    "openai>=1.40",
    "litellm>=1.50",
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "gradio>=5.0,<6",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Local HuggingFace all-MiniLM-L6-v2 embeddings (used by the "basic" pipeline by default; pulls in torch)
local = ["sentence-transformers>=3.0"]
# t-SNE vector visualization
viz = ["scikit-learn>=1.4", "plotly>=5.20", "numpy>=1.26"]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "rag_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "code-generator"
version = "0.1.0"
description = "Port Python to high-performance C++ or Rust with LLMs, then compile, run and compare runtimes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "gradio>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
code-generator = "code_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

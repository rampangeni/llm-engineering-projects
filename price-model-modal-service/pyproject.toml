[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-model-modal-service"
version = "0.1.0"
description = "Serverless GPU deployment (Modal) of the fine-tuned Llama 3.2 3B QLoRA price predictor, plus a thin Python client and CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.1.4",
    "python-dotenv>=1.1.1",
    "litellm>=1.77.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
price-model = "price_model_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/price_model_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

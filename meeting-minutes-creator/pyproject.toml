[project]
name = "meeting-minutes-creator"
version = "0.1.0"
description = "Turn meeting audio into markdown minutes: Whisper transcription + Llama (4-bit) or an OpenAI API fallback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "gradio>=5,<6",
]

[project.optional-dependencies]
# GPU / local open-source path (Whisper + Llama 3.1 8B in 4-bit). Install on a CUDA box or Colab T4.
local = [
    "torch",
    "transformers>=4.56",
    "accelerate",
    "bitsandbytes; sys_platform != 'darwin'",
    "huggingface_hub",
]
# Token-probability graph ("how inference works")
viz = ["networkx", "matplotlib"]
dev = ["pytest>=8"]

[project.scripts]
meeting-minutes = "meeting_minutes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_minutes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

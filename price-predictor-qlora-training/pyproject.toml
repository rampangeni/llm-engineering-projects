[project]
name = "price-predictor-qlora-training"
version = "0.1.0"
description = "QLoRA fine-tune Llama 3.2 3B (or any causal LM) to predict product prices; push LoRA adapters to the HF Hub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "datasets>=3.6,<5",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
# Everything needed on the GPU machine (Colab / Modal / your own CUDA box). Linux + NVIDIA only (bitsandbytes).
gpu = [
    "torch>=2.3",
    "transformers>=4.46,<5",
    "accelerate>=0.34",
    "peft>=0.13,<0.20",
    "trl>=0.20,<1",
    "bitsandbytes>=0.43",
    "wandb>=0.17",
]
dev = ["pytest>=8"]

[project.scripts]
qlora-prepare-prompts = "price_qlora.prepare_prompts:main"
qlora-quant-compare = "price_qlora.quant_compare:main"
qlora-train = "price_qlora.train:main"
qlora-evaluate = "price_qlora.evaluate:main"
qlora-infer = "price_qlora.infer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_qlora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
